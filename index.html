<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ioana &amp; Rareș · 3.10.2026</title>
    <meta name="description" content="Ioana și Rareș se căsătoresc pe 3 octombrie 2026 la Zalău. · Ioana and Rareș are getting married on 3 October 2026 in Zalău.">
    <meta name="theme-color" content="#3A1420">
    <link rel="icon" href="seal.svg">

    <!-- Link preview for WhatsApp, iMessage and the rest. Scrapers need
         absolute URLs, so these point at the live GitHub Pages address. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Ioana &amp; Rareș · 3.10.2026">
    <meta property="og:description" content="Ne căsătorim și ne-ar bucura să fiți alături de noi. · We're getting married and would love you to be there.">
    <meta property="og:image" content="https://ioanat09.github.io/wedding_site/img/share-preview.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://ioanat09.github.io/wedding_site/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://ioanat09.github.io/wedding_site/img/share-preview.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=60">

    <!-- Text is injected from content.js, so with JS off there is nothing to
         show. Hide the envelope and explain, rather than sit on a dead page. -->
    <noscript>
        <style>
            #envelope-screen { display: none !important; }
        </style>
    </noscript>
</head>
<body>

<!-- ===========================================================================
     All wording comes from content.js via the data-i18n keys below.
     Edit the text there, not here.
     ======================================================================== -->

<noscript>
    <p class="noscript-note">
        Această invitație are nevoie de JavaScript. · This invitation needs JavaScript.
    </p>
</noscript>

<!-- ===================== ENVELOPE INTRO =====================
     Plain 2D: the parts stack with z-index and only transform and opacity
     are animated. Order below is also paint order —
     shadow, back, letter, front panel, flap, seal.
     ========================================================== -->
<div id="envelope-screen">
    <div class="env-scrim" aria-hidden="true"></div>
    <button id="lang-toggle-env" class="lang-toggle" data-i18n-aria-label="a11y.lang"></button>

    <div class="env-stage">
        <div class="envelope" id="envelope">
            <div class="env-body">
                <div class="env-shadow" aria-hidden="true"></div>
                <div class="env-back" aria-hidden="true"></div>

                <div class="env-letter">
                    <p class="letter-eyebrow" data-i18n="envelope.eyebrow"></p>
                    <p class="letter-names">Ioana <span class="amp">&amp;</span> Rareș</p>
                    <p class="letter-date">3 . 10 . 2026</p>
                </div>

                <!-- Front panel, with the V cut out so the letter is visible
                     inside once the flap lifts. The notch is inset slightly
                     so the closed flap overhangs it — see style.css. -->
                <div class="env-pocket" aria-hidden="true"></div>

                <div class="env-flap" aria-hidden="true">
                    <div class="flap-face flap-outer"></div>
                    <div class="flap-face flap-inner"></div>
                </div>

                <button type="button" class="env-seal" id="seal" data-i18n-aria-label="a11y.open">
                    <span class="seal-face">
                        <span class="seal-half seal-left" aria-hidden="true"></span>
                        <span class="seal-half seal-right" aria-hidden="true"></span>
                    </span>
                    <span class="seal-mark">I&amp;R</span>
                </button>
            </div>
        </div>
    </div>

    <p class="tap-hint" data-i18n="envelope.hint"></p>
    <img class="env-flower" src="img/flower-decor.webp" alt="" aria-hidden="true">
</div>

<!-- ===================== SITE ===================== -->
<div id="site" hidden>

    <!-- language toggle -->
    <button id="lang-toggle" class="lang-toggle" data-i18n-aria-label="a11y.lang"></button>

    <!-- HERO — entrance is driven by #site.is-entering, not the scroll
         observer, so it stays in step with the intro leaving. -->
    <header class="hero">
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 class="names">Ioana <span class="amp">&amp;</span> Rareș</h1>
        <p class="hero-date" data-i18n="hero.date"></p>
    </header>

    <!-- STORY / WELCOME -->
    <section class="section paper" id="welcome">
        <div class="crease" aria-hidden="true"></div>
        <div class="section-inner reveal" data-reveal="fade-up">
            <p class="body-text" data-i18n="welcome.body"></p>
            <p class="godparents-intro" data-i18n="welcome.godparents.intro"></p>
            <div class="godparents">
                <p class="godparent-pair">
                    <span class="godparent-names" data-i18n="welcome.godparents.pair1.names"></span>
                    <span class="godparent-surname" data-i18n="welcome.godparents.pair1.surname"></span>
                </p>
                <p class="godparent-pair">
                    <span class="godparent-names" data-i18n="welcome.godparents.pair2.names"></span>
                    <span class="godparent-surname" data-i18n="welcome.godparents.pair2.surname"></span>
                </p>
            </div>
        </div>
    </section>

    <!-- COUNTDOWN -->
    <section class="section paper countdown-section" id="countdown">
        <div class="crease" aria-hidden="true"></div>
        <div class="section-inner reveal" data-reveal="fade-up">
            <p class="eyebrow" data-i18n="countdown.eyebrow"></p>
            <!-- Filled in by script.js; the dashes are what shows if it can't be. -->
            <div class="countdown" id="countdown-units">
                <div class="cd-unit">
                    <span class="cd-num" data-cd="days">–</span>
                    <span class="cd-label" data-i18n="countdown.days"></span>
                </div>
                <div class="cd-unit">
                    <span class="cd-num" data-cd="hours">–</span>
                    <span class="cd-label" data-i18n="countdown.hours"></span>
                </div>
                <div class="cd-unit">
                    <span class="cd-num" data-cd="minutes">–</span>
                    <span class="cd-label" data-i18n="countdown.minutes"></span>
                </div>
            </div>
            <p class="countdown-past" data-i18n="countdown.past" hidden></p>
        </div>
    </section>

    <!-- DETAILS -->
    <section class="section ink" id="details">
        <div class="section-inner">
            <p class="details-date" data-i18n="details.date"></p>
            <!-- --i staggers each item's reveal; see .details-grid .reveal -->
            <div class="details-grid">
                <div class="detail-card reveal" data-reveal="fade-up" style="--i:0">
                    <svg class="detail-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M16 3v4"/>
                        <path d="M13.5 5.5h5"/>
                        <path d="M7 14 16 7l9 7"/>
                        <path d="M9 14v12h14V14"/>
                        <path d="M13.5 26v-6a2.5 2.5 0 0 1 5 0v6"/>
                        <path d="M6 26h20"/>
                    </svg>
                    <p class="detail-label" data-i18n="details.ceremony.label"></p>
                    <p class="detail-value" data-i18n="details.ceremony.value"></p>
                    <p class="detail-sub" data-i18n="details.ceremony.sub"></p>
                    <!-- Swap the query for the real address, keeping the + signs -->
                    <a class="detail-link" data-i18n="details.map" target="_blank" rel="noopener"
                       href="https://maps.app.goo.gl/jGUjUno36yQrhCJo9"></a>
                </div>
                <div class="detail-card reveal" data-reveal="fade-up" style="--i:1">
                    <svg class="detail-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M8 26 14 10 22 16Z"/>
                        <path d="M19 5l1.5 2.5"/>
                        <path d="M25 9l-1 3"/>
                        <path d="M27 16l-2.5 1"/>
                        <circle cx="24" cy="6" r="0.9" fill="currentColor" stroke="none"/>
                        <circle cx="28" cy="12" r="0.9" fill="currentColor" stroke="none"/>
                        <circle cx="23" cy="21" r="0.9" fill="currentColor" stroke="none"/>
                    </svg>
                    <p class="detail-label" data-i18n="details.reception.label"></p>
                    <p class="detail-value" data-i18n="details.reception.value"></p>
                    <p class="detail-sub" data-i18n="details.reception.sub"></p>
                    <a class="detail-link" data-i18n="details.map" target="_blank" rel="noopener"
                       href="https://maps.app.goo.gl/jQ6PPUy2ttny6vv59"></a>
                </div>
            </div>

            <!-- The calendar file is built in script.js from the same strings
                 shown above, so there is no second copy of the details to
                 keep in step. -->
            <div class="calendar reveal" data-reveal="fade-up">
                <button type="button" class="calendar-btn" id="calendar-btn" data-i18n="details.calendar"></button>
            </div>
        </div>
    </section>

    <!-- GALLERY — images come from the GALLERY array in content.js -->
    <section class="section paper" id="gallery">
        <div class="crease" aria-hidden="true"></div>
        <div class="section-inner wide">
            <div class="reveal" data-reveal="fade-up">
                <p class="eyebrow" data-i18n="gallery.eyebrow"></p>
            </div>
            <div class="gallery" id="gallery-grid"></div>
        </div>
    </section>

    <!-- RSVP -->
    <section class="section ink" id="rsvp">
        <div class="section-inner center reveal" data-reveal="fade-up">
            <p class="eyebrow light" data-i18n="rsvp.eyebrow"></p>
            <p class="rsvp-deadline" data-i18n="rsvp.deadline"></p>
            <a href="https://forms.gle/ZVrhXpP4dwakZyyF8" target="_blank" rel="noopener" class="rsvp-btn" data-i18n="rsvp.button"></a>
        </div>
    </section>

    <footer class="footer">
        <p><span class="footer-names">Ioana <span class="amp">&amp;</span> Rareș</span> · 3.10.2026</p>
    </footer>

</div>

<script src="content.js?v=35"></script>
<script src="script.js?v=20"></script>
</body>
</html>
